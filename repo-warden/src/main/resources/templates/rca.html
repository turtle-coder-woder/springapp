<!doctype html>
    <html lang="en" xmlns:th="http://www.thymeleaf.org"
          th:replace="base :: Layout(~{::section} , ${hideNavbar})">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home</title>
    </head>
    <body>
    <section class="container mt-5">
        <h2 class="mb-4">Prs which we think are affected</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
            <tr>
                <th>External ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>URL</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pullRequest : ${pullRequestsList}">
                <td th:text="${pullRequest.number}"></td>
                <td th:text="${pullRequest.title}"></td>
                <td th:text="${pullRequest.description}"></td>
                <td><a th:href="${pullRequest.htmlUrl}" th:text="${pullRequest.htmlUrl}" target="_blank"></a></td>
            </tr>
            </tbody>
        </table>
    </section>
    </body>
    </html>
